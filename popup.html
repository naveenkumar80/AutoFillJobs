<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QuickFill</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header Bar -->
  <header class="header">
    <div class="brand-group">
      <div class="header-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
        </svg>
      </div>
      <div class="header-text">
        <h1>QuickFill</h1>
        <span class="version-badge">v1.2</span>
      </div>
    </div>
    <div class="header-status">
      <button type="button" class="btn-theme-toggle" id="themeToggle" title="Toggle Theme (Dark / Light)" aria-label="Toggle Theme">
        <svg class="theme-icon-sun" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon-moon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <span class="status-dot"></span>
      <span class="status-text">Active</span>
    </div>
  </header>

  <!-- Profile Preview Card -->
  <div id="profilePreview" class="profile-preview">
    <div class="profile-row">
      <div class="profile-avatar">QF</div>
      <div class="profile-info">
        <div class="profile-name">Candidate Profile</div>
        <div class="profile-email">Ready to auto-fill applications</div>
      </div>
      <span class="profile-badge ready">● Ready</span>
    </div>
  </div>

  <!-- Primary Trigger Action & AI Toggle -->
  <div class="fill-section">
    <button id="btnFill" class="btn-fill">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="5 3 19 12 5 21 5 3"></polygon>
      </svg>
      <span id="btnFillText">Fill Application Now</span>
    </button>
    <div class="ai-toggle-row" id="aiToggleRow" style="display: none;">
      <div class="ai-toggle-label">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
        </svg>
        <span>AI Auto-Complete</span>
      </div>
      <label class="mini-toggle">
        <input type="checkbox" id="aiToggle" checked />
        <span class="mini-toggle-slider"></span>
      </label>
    </div>
  </div>

  <!-- Telemetry / Status Box -->
  <div id="statusArea" class="status-area">
    <div class="status-header-row">
      <span class="status-title">Session Telemetry</span>
    </div>
    <div id="statusMessage" class="status-message">
      <span class="dot idle"></span>
      <span>Ready — open a job application form and click Fill</span>
    </div>
    <div id="statsRow" class="stats-row" style="display: none;">
      <div class="stat-item">
        <div id="statFound" class="stat-value blue">—</div>
        <div class="stat-label">Detected</div>
      </div>
      <div class="stat-item">
        <div id="statProfile" class="stat-value green">—</div>
        <div class="stat-label">Profile</div>
      </div>
      <div class="stat-item">
        <div id="statAI" class="stat-value purple">—</div>
        <div class="stat-label">AI Engine</div>
      </div>
    </div>
  </div>

  <!-- Footer Navigation -->
  <footer class="footer">
    <button id="btnSettings" class="btn-settings">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
      <span>Settings &amp; Knowledge Base</span>
    </button>
  </footer>

  <script src="scripts/logger.js"></script>
  <script src="popup.js"></script>
</body>
</html>
